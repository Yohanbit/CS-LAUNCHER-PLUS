name: Build Unamed launcher Vulkan 1.1 safety prerelease

on:
  workflow_dispatch:
  push:
    branches: [fix/vulkan11-native-round3]
    paths:
      - '**'
      - '!README.md'
      - '!CREDITS.md'
      - '!docs/**'

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'push' || (!contains(github.event.head_commit.message, '[release-cleanup]') && !contains(github.event.head_commit.message, '[skip apk]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build dependencies
        run: |
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;27.3.13750724'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run all host logic and native tests
        env:
          MEASUREMENT_REQUIRE_NDK: '1'
          NATIVE_REQUIRE_NDK: '1'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          for test in tools/test-*.sh; do
            echo "=== $test ===" | tee -a verification/tests.txt
            bash "$test" 2>&1 | tee -a verification/tests.txt
          done
      - name: Identify and download the latest existing APK without changing releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previous
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > verification/releases-before.json
          python3 - <<'PY'
          import json, os, urllib.request
          pages = json.load(open('verification/releases-before.json'))
          releases = sorted((r for page in pages for r in page if not r['draft']), key=lambda r:r['published_at'] or r['created_at'], reverse=True)
          for release in releases:
              assets = [a for a in release['assets'] if a['name'].lower().endswith('.apk')]
              if not assets: continue
              asset = assets[0]
              urllib.request.urlretrieve(asset['browser_download_url'], 'previous/previous.apk')
              with open('verification/previous-apk.json', 'w') as f:
                  json.dump({'release':release['html_url'], 'tag':release['tag_name'], 'apk':asset['browser_download_url'], 'name':asset['name'], 'id':asset['id']}, f, indent=2)
              print('Prior identified artifact (not physical validation):', release['html_url'], asset['name'])
              break
          else:
              print('No previous APK available; continuity unverified')
          PY
      - name: Load Firebase configuration if supplied
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app_pojavlauncher/google-services.json
          fi
      - name: Package verified MobileGlues 2.0.0 renderer
        shell: bash
        run: |
          set -euo pipefail
          mg_apk="$RUNNER_TEMP/MobileGlues_2.0.0.apk"
          curl --fail --location --retry 3 --output "$mg_apk" \
            'https://github.com/MobileGL-Dev/MobileGlues-release/releases/download/V2.0.0/MobileGlues_2.0.0.apk'
          echo "a7e1eb29731fdece7ab3af7fb00692b856f1808a7544436e7b3eb6c08355581a  $mg_apk" | sha256sum --check --strict
          for abi in arm64-v8a armeabi-v7a; do
            out="app_pojavlauncher/src/main/jniLibs/$abi"
            mkdir -p "$out"
            unzip -p "$mg_apk" "lib/$abi/libmobileglues.so" > "$out/libmobileglues.so"
            test -s "$out/libmobileglues.so"
            readelf -h "$out/libmobileglues.so"
            readelf -d "$out/libmobileglues.so" | grep NEEDED
          done
      - name: Package checksum-pinned Android LWJGL and SDL natives
        run: python3 tools/package_android_natives.py
      - name: Build signed test APK
        run: |
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleDebug :app_pojavlauncher:testDebugUnitTest -PallowMissingFirebase=true -PextremeVersion=1.4.3-vulkan11-test -PverifiedVersionCode="$((10010000 + GITHUB_RUN_NUMBER))" --no-daemon --stacktrace
      - name: Verify renderer is included in every APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, zipfile
          apks = glob.glob('app_pojavlauncher/build/outputs/apk/debug/*.apk')
          if not apks:
              raise SystemExit('No APK was built')
          for apk in apks:
              with zipfile.ZipFile(apk) as z:
                  abis = {p.split('/')[1] for p in z.namelist() if p.startswith('lib/') and p.endswith('.so')}
                  if not abis:
                      raise SystemExit('APK contains no native libraries')
                  for abi in abis:
                      path = f'lib/{abi}/libmobileglues.so'
                      if path not in z.namelist() or z.getinfo(path).file_size == 0:
                          raise SystemExit(f'Missing MobileGlues for {abi} in {apk}')
                  for version in ['3.3.3', '3.4.1']:
                      for abi in abis:
                          core = f'assets/components/lwjgl-{version}-natives/{abi}/liblwjgl.so'
                          if core not in z.namelist() or z.getinfo(core).file_size == 0:
                              raise SystemExit(f'Missing Android LWJGL {version}/{abi}')
                  for abi in abis:
                      for lib in ['libSDL3.so', 'libSDL2.so', 'libopenal.so', 'libspirv-cross-c-shared.so']:
                          if f'lib/{abi}/{lib}' not in z.namelist():
                              raise SystemExit(f'Missing {lib}/{abi}')
                  print(f'Verified MobileGlues in {apk}: {sorted(abis)}')
          PY
      - name: Name the downloadable APK
        run: mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk 'app_pojavlauncher/build/outputs/apk/debug/Unamed launcher.apk'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Unamed-launcher-vulkan11-APK
          path: app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Verify signature and installation requirements
        shell: bash
        run: |
          set -euo pipefail
          extra=()
          if [ -f previous/previous.apk ]; then extra=(--previous previous/previous.apk); fi
          for apk in app_pojavlauncher/build/outputs/apk/debug/*.apk; do
            python3 tools/inspect_apk.py "$apk" "${extra[@]}" --apksigner "$ANDROID_HOME/build-tools/34.0.0/apksigner" --aapt "$ANDROID_HOME/build-tools/34.0.0/aapt" | tee verification/apk-inspection.txt
          done
          git rev-parse HEAD | tee verification/commit.txt
      - name: Upload verification results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Unamed-launcher-verification
          path: verification/
          if-no-files-found: warn
          retention-days: 30
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Unamed-launcher-vulkan11-APK
          path: apk
      - uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Unamed-launcher-verification
          path: verification
      - name: Publish public test download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_RUN: ${{ github.run_id }}
        run: |
          gh release create "vulkan11-1.4.3-$BUILD_RUN" apk/*.apk verification/apk-inspection.txt verification/tests.txt verification/commit.txt verification/previous-apk.json \
            --target "$BUILD_SHA" \
            --title "Unamed launcher 1.4.3 — prerelease de prueba $BUILD_RUN" \
            --prerelease \
            --notes-file source/docs/ROUND3-RELEASE-NOTES.md
          gh release view "vulkan11-1.4.3-$BUILD_RUN" --json name,url,assets --jq '{name,url,assets:[.assets[]|{name,size,url}]}'
