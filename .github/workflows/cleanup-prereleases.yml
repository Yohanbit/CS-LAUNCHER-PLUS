name: Keep only current Unamed launcher prerelease

on:
  push:
    branches: [cs-1.4-full-fps-extreme]
    paths: ['.github/workflows/cleanup-prereleases.yml']

permissions:
  contents: write

concurrency:
  group: cleanup-prereleases
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      KEEP_TAG: extreme-1.4-38024024121
    steps:
      - name: Validate current APK and delete older published prereleases
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/tags/$KEEP_TAG" > keep.json
          jq -e '.prerelease == true and .draft == false and any(.assets[]; .name == "Unamed.launcher.apk" and .size > 1000000)' keep.json
          # Snapshot every page before deleting, so pagination cannot skip entries.
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > pages.json
          jq --arg keep "$KEEP_TAG" '[.[][] | select(.prerelease == true and .draft == false and .tag_name != $keep) | {id,tag_name,name}]' pages.json > delete.json
          echo 'Prereleases selected for deletion (tags and source commits are retained):'
          jq . delete.json
          while IFS= read -r id; do
            gh api --method DELETE "repos/$GH_REPO/releases/$id"
            echo "Deleted prerelease ID $id"
          done < <(jq -r '.[].id' delete.json)
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > after.json
          jq -e --arg keep "$KEEP_TAG" '[.[][] | select(.prerelease == true and .draft == false)] | length == 1 and .[0].tag_name == $keep' after.json
          echo "SUCCESS: only prerelease $KEEP_TAG remains; main and source history unchanged."
